<div id="lock" hidden>
  <h1>Progress</h1>
  <p class="sub">This page is locked. Type the password you were given.</p>
  <form id="lockform" autocomplete="on">
    <input type="text" name="username" value="progress" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password" required>
    <button class="btn" type="submit">Open</button>
    <label class="small muted" style="flex-basis:100%"><input type="checkbox" id="remember"> Remember on this device</label>
  </form>
  <p id="lockmsg" class="warn small" role="alert"></p>
</div>
<div id="app" hidden></div>

<script>
let CONFIG = {"locked": true, "salt": "97d32852ce530716089638c5e8b51c71", "iter": 310000};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
const fmtDate = d => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return x.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"}); };
const VCLS = {right:"Right first time", nowork:"Right; working added when asked", fixed:"Right after a fix", notyet:"Not yet right", skip:"Skipped", none:"Not checked"};
let KEYS = null, D = null;

/* ── the lock: PBKDF2 -> AES-CBC + HMAC, as app/make_dashboard.py seals it ── */
const hex2buf = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
async function deriveKeys(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:hex2buf(CONFIG.salt), iterations:CONFIG.iter}, base, 512));
  return {raw: bits, enc: await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-CBC", false, ["decrypt"]),
          mac: await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"])};
}
async function openSealed(buf){
  const b = new Uint8Array(buf), iv = b.slice(0,16), ct = b.slice(16, b.length - 32), tag = b.slice(b.length - 32);
  const signed = b.slice(0, b.length - 32);
  if (!await crypto.subtle.verify("HMAC", KEYS.mac, tag, signed)) throw new Error("bad");
  return crypto.subtle.decrypt({name:"AES-CBC", iv}, KEYS.enc, ct);
}
async function fetchSealed(path){
  const r = await fetch(path, {cache:"no-store"});
  if (!r.ok) throw new Error("missing " + path);
  return openSealed(await r.arrayBuffer());
}
async function unlock(pw, remember){
  KEYS = await deriveKeys(pw);
  const plain = await fetchSealed("data.bin");
  D = JSON.parse(new TextDecoder().decode(plain));
  try { if (remember) localStorage.setItem("dash-key", Array.from(KEYS.raw).map(x => x.toString(16).padStart(2,"0")).join("") + ":" + CONFIG.salt); } catch(e) {}
}
async function unlockSaved(){
  let saved = null; try { saved = localStorage.getItem("dash-key"); } catch(e) {}
  if (!saved) return false;
  const [k, salt] = saved.split(":");
  if (salt !== CONFIG.salt) { try { localStorage.removeItem("dash-key"); } catch(e) {} return false; }
  const bits = hex2buf(k);
  KEYS = {raw: bits, enc: await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-CBC", false, ["decrypt"]),
          mac: await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"])};
  try { D = JSON.parse(new TextDecoder().decode(await fetchSealed("data.bin"))); return true; }
  catch(e){ try { localStorage.removeItem("dash-key"); } catch(_) {} KEYS = null; return false; }
}
const imgCache = {};
async function inkSrc(path){
  if (!CONFIG.locked) return path;
  if (imgCache[path]) return imgCache[path];
  const buf = await fetchSealed((D.ink_names || {})[path] || path.replace(/\.png$/, ".bin"));
  return imgCache[path] = URL.createObjectURL(new Blob([buf], {type: /\.jpe?g$/i.test(path) ? "image/jpeg" : "image/png"}));
}

/* ── small charts, drawn as SVG ── */
function barChart(rows, {value, label, stack, height = 160, unit = ""}){
  if (!rows.length) return `<p class="empty">Nothing yet.</p>`;
  const W = Math.max(320, rows.length * 56), H = height, pad = {l:34, r:8, t:10, b:34};
  const vals = rows.map(r => stack ? stack.reduce((s, k) => s + (r[k.key] || 0), 0) : (value(r) || 0));
  const max = Math.max(1, ...vals), step = max <= 5 ? 1 : Math.ceil(max / 4);
  const top = Math.ceil(max / step) * step, ih = H - pad.t - pad.b, bw = Math.min(36, (W - pad.l - pad.r) / rows.length * .62);
  let g = "";
  for (let v = 0; v <= top; v += step){ const y = pad.t + ih - ih * v / top; g += `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  rows.forEach((r, i) => {
    const cx = pad.l + (i + .5) * (W - pad.l - pad.r) / rows.length;
    let y = pad.t + ih;
    const parts = stack || [{key:null, cls:"i-accent"}];
    parts.forEach(p => {
      const v = p.key ? (r[p.key] || 0) : (value(r) || 0), h = ih * v / top;
      if (h > 0){ y -= h; g += `<rect x="${cx - bw/2}" y="${y}" width="${bw}" height="${h}" rx="3" fill="var(${p.color || "--accent"})"><title>${esc(label(r))}: ${v}${unit}${p.name ? " " + p.name : ""}</title></rect>`; }
    });
    g += `<text x="${cx}" y="${H - pad.b + 16}" text-anchor="middle">${esc(label(r))}</text>`;
  });
  return `<div class="tablebox"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 640)}px" role="img">${g}</svg></div>`;
}
const bar3 = (x, o = 0) => { const r = x.right || 0, w = x.nowork || 0, f = x.fixed || 0, n = x.notyet || 0, t = Math.max(1, r + w + f + n + o); return `<div class="bar3" title="${r} right first time, ${w} right with working added when asked, ${f} after a fix, ${n} not yet${o ? ", " + o + " other" : ""}"><i class="i-right" style="width:${100*r/t}%"></i><i class="i-nowork" style="width:${100*w/t}%"></i><i class="i-fixed" style="width:${100*f/t}%"></i><i class="i-notyet" style="width:${100*n/t}%"></i><i class="i-other" style="width:${100*o/t}%"></i></div>`; };
const LEGEND = `<div class="legend"><span style="--c:var(--right)">right first time</span><span style="--c:var(--nowork)">right, working added when asked</span><span style="--c:var(--fixed)">right after a fix</span><span style="--c:var(--notyet)">not yet right</span></div>`;
const probLinks = ids => ids && ids.length ? `<span class="linkrow">${ids.map(id => { const p = D.problems.find(x => x.id === id); return p ? `<a href="#p-${esc(id)}" data-go="${esc(id)}">#${p.n}</a>` : ""; }).join("")}</span>` : "";

/* Lindsay 2026-09-25: mark a topic his class (Math 7) does not cover. Adults only: his screens never say it. */
function advTag(p){
  const c = p.coverage || {};
  if (c.level === "advanced") return `<span class="adv" title="${esc(c.why || "")}">7A only · Advanced</span>`;
  if (c.level === "beyond_outline") return `<span class="adv soft" title="${esc(c.why || "")}">beyond the Math 7 outline so far</span>`;
  return "";
}
/* a missed problem's follow-up: later problems of the same shape, or that the app owes him one */
const MARK = {right: "✓ right", nowork: "✓ right (working added)", fixed: "✗ then fixed", notyet: "✗ not yet"};
function followLine(p){
  const L = p.lookalikes || [];
  if (L.length) return "Look-alikes since: " + L.map(q => `<a href="#p-${esc(q.id)}" data-go="${esc(q.id)}">#${q.n}</a> ${esc(MARK[q.cls] || q.cls)}`).join(", ") + (p.lookalike_due ? " · another is due at his next sitting" : "");
  return p.lookalike_due ? "No look-alike yet: the app gives him one at his next sitting." : "";
}
/* Lindsay's latest review of his work, in plain words (work/app-reviews.json) */
function reviewBlock(){

/* ── the page (rebuilt 2026-09-26 on Lindsay's brief): key numbers · where he needs help · is he improving ·
   every problem (app, class, Math Academy) · how he learns · time · how to read ── */
const SRCW = {app: "App", class: "Class", ma: "Math Academy"};
const RESW = {right: ["Right", "p-right"], nowork: ["Right (working added when asked)", "p-nowork"], fixed: ["Wrong, then fixed", "p-fixed"],
              wrong: ["Wrong", "p-notyet"], partial: ["Incomplete", "p-fixed"], other: ["Not marked", "p-none"], guess: ["A guess", "p-none"]};
/* a lesson question (09-27): his picks in order; right or wrong on the FIRST pick; a guess is never counted wrong */
const resPill = x => x.res === "guess" && x.lqword ? [x.lqword[0].toUpperCase() + x.lqword.slice(1), "p-none"] : x.lq && x.res === "wrong" ? ["Wrong first pick", "p-notyet"] : x.lq && x.res === "right" ? ["Right first pick", "p-right"] : RESW[x.res];
const lqTag = x => x.lq ? ` <span class="who p">Lesson question</span>` : "";
const isRight = x => x.res === "right" || x.res === "nowork";
const byId = id => (D.everything || []).find(x => x.id === id);
const srcTag = x => `<span class="who ${x.src === "app" ? "a" : x.teacher ? "t" : x.src === "ma" ? "m" : "p"}">${x.src === "app" ? "App" : x.teacher ? "Class · teacher-marked" : x.src === "ma" ? "Math Academy" : "Class · read from a photo"}</span>`;
const goLinkU = (id, text) => `<a href="#u-${esc(id)}" data-go="${esc(id)}">${esc(text)}</a>`;
function exampleBox(id){
  const x = byId(id); if (!x) return "";
  return `<div class="ex">${srcTag(x)} <span class="muted small">${esc(x.where)} · ${esc(fmtDate(x.date))}</span>
    <div class="qtext"><b>Question:</b> ${esc(x.question)}</div>
    <div>${x.lq ? esc(x.his || "No pick recorded") : `<b>He wrote:</b> ${x.his && x.his !== "UNKNOWN" ? esc(x.his) : '<span class="muted">not visible</span>'}`} · <b>Right answer:</b> ${esc(x.key || "—")} <span class="pill ${resPill(x)[1]}">${esc(resPill(x)[0])}</span></div>
    <div class="small">${goLinkU(id, "Open it with the page")}</div></div>`;
}
const evLine = ev => ["app", "class", "ma"].filter(k => ev[k]).map(k => `${SRCW[k]} ${ev[k].right} of ${ev[k].tried} right`).join(" · ");

      <div class="stat"><div class="l">Duel firewood</div><div class="v">${esc(M.week.duel || 0)} <span class="small muted">firewood</span></div><div class="s">this week (${esc(M.week.work || 0)} from ordinary work)</div></div>

/* where the firewood came from, week by week (Monday to Sunday): ordinary work, quests, the mega quest, the duel */

let FSRC = "all", FRES = "all", SHOWN = 60;
function drawProblems(){

      <span class="pill ${resPill(x)[1]}">${esc(resPill(x)[0])}</span></summary><div class="body"></div></details>`).join("")

  const more = $("#more"); if (more) more.addEventListener("click", () => { SHOWN += 60; drawProblems(); });

      <div class="small">${(x.skills || []).length ? "Skills: " + x.skills.map(s => `<span class="skbadge">${esc(s)}</span>`).join("") : '<span class="muted">No matching skill in the app.</span>'}</div>
      <div class="qtext"><b>Question:</b> ${esc(x.question)}</div>
      <p><b>He wrote:</b> ${x.his === "UNKNOWN" ? '<span class="muted">not shown on Math Academy’s screens</span>' : esc(x.his || "(blank)")}<br><b>Right answer:</b> ${esc(x.key)}</p>
      ${x.note ? `<p class="small"><b>Note:</b> ${esc(x.note)}</p>` : ""}
      ${x.photo ? `<img class="inkimg" data-src="${esc(x.photo)}" alt="Photo of the page">` : '<p class="small muted">No photo on file.</p>'}`;
  } else {
    const p = D.problems.find(y => y.id === x.id);
    const q = p.lq;
    const lqBox = q ? `<div class="pagebox"><div class="pl">Lesson question · ${esc(q.stage_word)}</div>
      <p>${q.picks.length ? esc(q.picks_line) : '<span class="muted">No pick recorded.</span>'}</p>
      <p class="small">${q.guess ? "A guess: never counted as a mistake." : q.first_right ? "Right on his first pick." : q.first_right === false ? "Wrong on his first pick: counted as a missed question." : ""} Picks from ${esc(q.source)}.</p></div>` : "";
    const pages = lqBox + p.pages.map(pg => `<div class="pagebox"><div class="pl">${esc(pg.label)}${pg.at ? ` <span class="muted small">${esc(pg.at)}</span>` : ""} · <span class="pill ${pg.neutral ? "p-none" : pg.right ? "p-right" : "p-notyet"}">${esc(pg.outcome)}</span></div>
      ${pg.img ? `<img class="inkimg" data-src="${esc(pg.img)}" alt="His handwritten page">` : ""}
      ${pg.qimg ? `<div class="small"><b>The question as he marked it</b> <span class="muted">(his marks in blue)</span></div><img class="inkimg" data-src="${esc(pg.qimg)}" alt="The question with his marks">` : ""}
      ${pg.tap ? `<p><b>${esc(pg.tap)}</b> <span class="muted small">(tapped)</span></p>` : ""}
      ${pg.reading ? `<div class="small"><b>What the checker read</b></div><div class="reading">${esc(pg.reading)}</div>` : ""}
      ${pg.mistake ? `<p><b>The mistake:</b> ${esc(pg.mistake)}</p>` : ""}
      ${(pg.also || []).filter(Boolean).map(a => `<p><b>Also:</b> ${esc(a)}</p>`).join("")}
      ${pg.told_cue ? `<p><b>Told him (where to look):</b> ${esc(pg.told_cue)}</p>` : ""}
      ${(pg.warn || []).map(w => `<p class="warn small">${esc(w)}</p>`).join("")}</div>`).join("");
    const cov = p.coverage || {};
    body.innerHTML = `${p.book ? `<div class="book">📖 In his book: ${esc(p.book)}</div>` : ""}${cov.level === "advanced" || cov.level === "beyond_outline" ? `<div class="small" style="margin-top:4px">${advTag(p)} ${esc(cov.why || "")}</div>` : ""}<div class="small muted" style="margin-top:4px">${esc(p.section_label)} · ${p.skills.map(s => `<span class="skbadge">${esc(s)}</span>`).join("")}</div>
      ${p.figure ? `<div class="qfig"><img alt="graph" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(p.figure)}"></div>` : ""}<div class="qtext"><b>Question:</b> ${esc(p.question)}</div><div class="key">Answer key: ${esc(p.key || "—")}</div>
      ${pages}
      ${followLine(p) ? `<div class="followbox"><b>Follow-up:</b> ${followLine(p)}</div>` : ""}
      ${p.ruling ? `<p class="small"><b>Lindsay's ruling:</b> ${esc(p.ruling)}</p>` : ""}
      ${p.disputed ? `<p class="warn small">He asked for another look at this one.</p>` : ""}`;
  }
  for (const img of body.querySelectorAll("img[data-src]")){
    try { img.src = await inkSrc(img.dataset.src); } catch(e){ img.replaceWith(Object.assign(document.createElement("p"), {className:"warn small", textContent:"This image could not be loaded."})); }
    img.addEventListener("click", () => { const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${img.src}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
  }
}
function goTo(id){
  FSRC = "all"; FRES = "all"; $("#fskill").value = ""; SHOWN = Math.max(SHOWN, (D.everything || []).findIndex(x => x.id === id) + 1);
  document.querySelectorAll(".chip[data-src],.chip[data-res]").forEach(c => c.setAttribute("aria-pressed", (c.dataset.src || c.dataset.res) === "all"));
  drawProblems();
  const d = document.getElementById("u-" + id); if (!d) return;
  d.open = true; fillProblem(d); d.scrollIntoView({behavior:"smooth", block:"start"});
  d.classList.add("flash"); setTimeout(() => d.classList.remove("flash"), 1600);
}

function learningSection(){
  const L = D.learning; if (!L || !L.simple) return "";
  return `<section id="learning"><h2>How he learns <span class="q">How the testing and re-testing is built</span></h2>
    <p class="lead">The app is built on a few findings from learning research. Each is below in one line, with an example from his own work showing whether it is happening yet.</p>
    ${L.simple.map((P, i) => `<div class="card principle"><div class="phead"><span class="pnum">${i + 1}</span><h3>${esc(P.title)}</h3><span class="pill p-${esc(P.status)}">${esc(P.status_word)}</span></div>
      <p class="idea">${esc(P.idea)}</p>${P.example ? `<div class="ex small"><b>In his work:</b> ${esc(P.example)}</div>` : ""}</div>`).join("")}
    <details class="card"><summary><b>What the app does not do yet</b></summary><ul class="gaps">${L.gaps.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <p class="small muted">From the app's code, ${esc(fmtDate(L.gaps_as_of))}. Research behind it: Roediger & Karpicke 2006 (recall); Cepeda et al. 2006 (spacing); Rohrer & Taylor 2007 and Rohrer, Dedrick & Stershic 2015 (mixing, in 7th-grade maths); Rawson, Dunlosky & Sciartelli 2013 (misses coming back).</p></details>
  </section>`;
}

function render(){
  const g = D.glance, A = g.all;
  document.title = D.title;
  const tk = D.takeaways.filter(t => t.kind === "todo").map(t => `<div class="take t-${t.kind}"><span class="tag">To do</span><div>${esc(t.text)}<span class="ev">${esc(t.ev)}</span></div></div>`).join("");
  const days = D.days;
  const sitRows = D.sittings.map(s => `<tr><td>${esc(fmtDate(s.date))}<div class="muted small">${esc(s.start)}–${esc(s.end || "?")}</div></td><td>${esc(s.kind)}${s.lessons.length ? `<div class="small muted">${s.lessons.map(l => "Lesson: " + esc(l.title)).join("<br>")}</div>` : ""}</td><td class="n">${s.minutes == null ? "—" : Math.round(s.minutes)}</td><td class="n">${s.problems}${s.planned ? ` <span class="muted">/ ${s.planned}</span>` : ""}</td><td class="n">${s.points}</td><td>${s.finished ? "Finished" : "Left early"}</td><td style="min-width:110px">${s.problems + s.lesson_questions ? bar3(s, s.problems + s.lesson_questions - s.right - s.nowork - s.fixed - s.notyet) : ""}</td></tr>`).join("");
  const pr = D.points_rules || {};
  $("#app").innerHTML = `<div class="wrap">
  <header class="top"><h1>${esc(D.title)}</h1>
    <div class="sub">Updated ${esc(D.built_at)}. ${g.last ? `Last app practice: ${esc(fmtDate(g.last.date))} at ${esc(g.last.time)}.` : "No app practice yet."}</div></header>
  <nav class="tabs"><a href="#top">Summary</a><a href="#gaps">Where he needs help</a><a href="#progress">Improving?</a><a href="#problems">Every problem</a><a href="#learning">How he learns</a><a href="#asks">Questions he asked</a><a href="#time">Time &amp; points</a><a href="#how">How to read this</a></nav>
  <section id="top">${keySection()}${glanceSection()}${jarSection()}${tk ? `<div style="margin-top:12px">${tk}</div>` : ""}</section>
  ${gapsSection()}
  ${progressSection()}
  ${allSection()}
  ${learningSection()}
  ${asksSection()}
  <section id="time"><h2>Time &amp; points <span class="q">How much is he doing in the app?</span></h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      <div class="card"><b>Minutes by day</b>${barChart(days, {value: d => d.minutes, label: d => fmtDate(d.date).replace(/^\w+,? /, ""), unit:" min"})}</div>
      <div class="card"><b>Problems by day</b>${barChart(days, {label: d => fmtDate(d.date).replace(/^\w+,? /, ""), stack:[{key:"right", color:"--right", name:"right first time"},{key:"nowork", color:"--nowork", name:"right, working added"},{key:"fixed", color:"--fixed", name:"after a fix"},{key:"notyet", color:"--notyet", name:"not yet"}]})}${LEGEND}</div>
    </div>
    <h3>Every sitting</h3>
    <div class="card tablebox"><table><tr><th>When</th><th>What</th><th class="n">Min</th><th class="n">Problems</th><th class="n">Points</th><th>Done?</th><th>Answers</th></tr>${sitRows || '<tr><td colspan="7" class="empty">No sittings yet.</td></tr>'}</table></div>
    <p class="small">Firewood (points): <b>${A.points}</b>, earned for taking part (${pr.submit || 3} a page, ${pr.fix || 3} a fix, ${pr.show_work || 2} for working, ${pr.sitting_done || 10} for finishing a sitting). It never goes down and does not measure right answers. Stars: ${D.stars.length}.</p>
  </section>
  <section id="how"><h2>How to read this</h2>
    <div class="explain"><dl>
      <dt>Where the work comes from</dt><dd><b>App</b>: his pages in the practice app, checked by an AI checker that reads his handwriting (it can misread; Lindsay's rulings correct it). <b>Class</b>: his class pages and exit tickets. Exit tickets are marked by his teacher; the rest are read from photos by this project, provisional until someone checks the paper. <b>Math Academy</b>: its own verdicts; it does not show what he typed.</dd>
      <dt>Right first time / wrong, then fixed</dt><dd>In the app a wrong answer gets a hint and one more try. “Wrong, then fixed” means the first answer was wrong and a later one right. “Working added when asked” is a right answer that needed its working shown; it is not a mistake.</dd>
      <dt>Skills</dt><dd>Every problem is filed under the main skill it practises. Class and Math Academy problems were matched to skills by this project from their wording.</dd>
      <dt>Evidence, not mastery</dt><dd>Right a week or more later is the first sign something has stuck.</dd>
      <dt>7A only · Advanced</dt><dd>A topic in 7A that his own class does not cover. Keinan never sees these labels.</dd>
    </dl></div>
  </section>
  <footer>Built by the practice app's Mac service from his app pages and work/attempts.csv.</footer>
  </div>`;
  wire();
  drawProblems();
}
function wire(){
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-go]"); if (a){ e.preventDefault(); goTo(a.dataset.go); return; }
    const s = e.target.closest(".chip[data-src]"); if (s){ FSRC = s.dataset.src; SHOWN = 60; document.querySelectorAll(".chip[data-src]").forEach(c => c.setAttribute("aria-pressed", c === s)); drawProblems(); return; }
    const r = e.target.closest(".chip[data-res]"); if (r){ FRES = r.dataset.res; SHOWN = 60; document.querySelectorAll(".chip[data-res]").forEach(c => c.setAttribute("aria-pressed", c === r)); drawProblems(); return; }
  });
  $("#fskill").addEventListener("change", () => { SHOWN = 60; drawProblems(); });
}

(async function start(){
  if (!CONFIG.locked){ D = window.DASH; $("#app").hidden = false; if (D) render(); else $("#app").textContent = "No data file next to this page."; return; }
  try { const r = await fetch("lock.json", {cache:"no-store"}); if (r.ok) CONFIG = Object.assign({}, CONFIG, await r.json()); } catch(e) {}
  if (!window.crypto || !crypto.subtle){ $("#lock").hidden = false; $("#lockmsg").textContent = "This browser cannot open the page (it needs https)."; return; }
  if (await unlockSaved()){ $("#app").hidden = false; render(); return; }
  $("#lock").hidden = false;
  $("#lockform").addEventListener("submit", async e => {
    e.preventDefault(); $("#lockmsg").textContent = "Opening…";
    try { await unlock($("#pw").value.trim(), $("#remember").checked); $("#lock").hidden = true; $("#app").hidden = false; render(); }
    catch(err){ KEYS = null; $("#lockmsg").textContent = "That password did not open it."; }
  });
})();
</script>
</body>
</html>
